<text x="171.5" y="224.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="171.5" dy="0.0">P(X &lt; 8)</tspan><tspan x="171.5" dy="15.0">= 8/40 = 0.20</tspan></text>
<text x="427.7" y="224.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="427.7" dy="0.0">P(10 &lt; X &lt; 26)</tspan><tspan x="427.7" dy="15.0">= 16/40 = 0.40</tspan></text>
<text x="738.7" y="224.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold"><tspan x="738.7" dy="0.0">P(X &gt; 30)</tspan><tspan x="738.7" dy="15.0">= 10/40 = 0.25</tspan></text>
<line x1="720.4" y1="180.0" x2="720.4" y2="144.0" stroke="#C0392B" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
<line x1="720.4" y1="280.0" x2="720.4" y2="270.0" stroke="#C0392B" stroke-width="2" fill="none"/>
<text x="714.4" y="148.0" font-size="12.5" fill="#C0392B" text-anchor="end" font-weight="bold">85th percentile: 0.85 × 40 = 34</text>
