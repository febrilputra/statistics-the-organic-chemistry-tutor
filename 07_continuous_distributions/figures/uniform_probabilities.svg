<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">Uniform distribution: probability = width ÷ total width</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">The density is a flat rectangle, so every probability is a smaller rectangle with the same height.</text>
<line x1="80.0" y1="280.0" x2="940.0" y2="280.0" stroke="#E6E6E6" stroke-width="1" fill="none"/>
<line x1="80.0" y1="180.0" x2="940.0" y2="180.0" stroke="#E6E6E6" stroke-width="1" fill="none"/>
<text x="510.0" y="108.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">Example 1: waiting for a train, uniform on [0, 40] minutes</text>
<rect x="98.3" y="180.0" width="146.4" height="100.0" stroke="none" fill="#F4B183"/>
<rect x="281.3" y="180.0" width="292.8" height="100.0" stroke="none" fill="#BFE3D6"/>
<rect x="647.2" y="180.0" width="183.0" height="100.0" stroke="none" fill="#D9C8E8"/>
