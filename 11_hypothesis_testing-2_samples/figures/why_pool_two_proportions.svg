<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="505" viewBox="0 0 1000 505" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">Why pool? <tspan fill="#0072B2">H0</tspan> says the rates are equal, but not what they are</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">Defective laptops: the spread of a proportion depends on the proportion itself, so we need one value for it.</text>
<rect x="40.0" y="85.0" width="270.0" height="90.0" rx="8" fill="#F7F9FB" stroke="#009E73" stroke-width="1.5"/>
<text x="175.0" y="108.0" font-size="14" fill="#009E73" text-anchor="middle" font-weight="bold">Batch 1</text>
<text x="175.0" y="128.0" font-size="12.5" fill="#222222" text-anchor="middle">32 defective out of 800</text>
<rect x="65.0" y="143.0" width="200.0" height="12" fill="#EEF1F4"/>
<rect x="65.0" y="143.0" width="100.0" height="12" fill="#009E73"/>
<text x="273.0" y="154.0" font-size="12" fill="#009E73" text-anchor="start" font-weight="bold">4%</text>
<rect x="350.0" y="85.0" width="270.0" height="90.0" rx="8" fill="#F7F9FB" stroke="#8E44AD" stroke-width="1.5"/>
<text x="485.0" y="108.0" font-size="14" fill="#8E44AD" text-anchor="middle" font-weight="bold">Batch 2</text>
<text x="485.0" y="128.0" font-size="12.5" fill="#222222" text-anchor="middle">30 defective out of 500</text>
<rect x="375.0" y="143.0" width="200.0" height="12" fill="#EEF1F4"/>
<rect x="375.0" y="143.0" width="150.0" height="12" fill="#8E44AD"/>
<text x="583.0" y="154.0" font-size="12" fill="#8E44AD" text-anchor="start" font-weight="bold">6%</text>
<line x1="175.0" y1="177.0" x2="290.0" y2="210.0" stroke="#222222" stroke-width="1.6" marker-end="url(#a)"/>
<line x1="485.0" y1="177.0" x2="370.0" y2="210.0" stroke="#222222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="90.0" y="214.0" width="480.0" height="104.0" rx="8" fill="#EEF5FB" stroke="#0072B2" stroke-width="1.5"/>
<text x="330.0" y="237.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">If <tspan fill="#0072B2">H0</tspan> (p₁ = p₂) is true, both batches share ONE defect rate</text>
<text x="330.0" y="258.0" font-size="12.5" fill="#222222" text-anchor="middle">Best estimate of that one rate: use all 1300 laptops together</text>
<text x="330.0" y="280.0" font-size="13.5" fill="#222222" text-anchor="middle" font-weight="bold">p̄ = (32 + 30) / (800 + 500) = 62 / 1300</text>
<rect x="215.0" y="293.0" width="200.0" height="12" fill="#EEF1F4"/>
<rect x="215.0" y="293.0" width="119.2" height="12" fill="#5B6B7A"/>
<text x="423.0" y="304.0" font-size="12" fill="#5B6B7A" text-anchor="start" font-weight="bold">4.77%</text>
<line x1="330.0" y1="320.0" x2="330.0" y2="346.0" stroke="#222222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="90.0" y="350.0" width="480.0" height="50.0" rx="8" fill="#F7F9FB" stroke="#9AA5B1" stroke-width="1.5"/>
<text x="330.0" y="371.0" font-size="13" fill="#222222" text-anchor="middle">SE = √( p̄(1 − p̄)(1/800 + 1/500) ) = √(0.0477 × 0.9523 × 0.00325) ≈ 0.0121</text>
<text x="330.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">the spread uses the shared rate p̄, as if <tspan fill="#0072B2">H0</tspan> were true</text>
<line x1="330.0" y1="402.0" x2="330.0" y2="428.0" stroke="#222222" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="90.0" y="432.0" width="480.0" height="56.0" rx="8" fill="#F7F9FB" stroke="#1F4E79" stroke-width="1.5"/>
<text x="330.0" y="454.0" font-size="13.5" fill="#222222" text-anchor="middle" font-weight="bold">z = (0.04 − 0.06 − 0) / 0.0121 ≈ −1.65</text>
<text x="330.0" y="476.0" font-size="13" fill="#1F4E79" text-anchor="middle" font-weight="bold">−1.65 is inside ±1.96 → fail to reject <tspan fill="#0072B2">H0</tspan></text>
<line x1="655.0" y1="85.0" x2="655.0" y2="490.0" stroke="#E1E4E8" stroke-width="1"/>
<text x="812.0" y="108.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">Compare: where does p come from?</text>
<rect x="675.0" y="125.0" width="275.0" height="140.0" rx="8" fill="#F7F9FB" stroke="#9AA5B1" stroke-width="1.5"/>
<text x="812.0" y="148.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">One proportion (Lesson 10.4)</text>
<text x="812.0" y="172.0" font-size="12.5" fill="#222222" text-anchor="middle"><tspan fill="#0072B2">H0</tspan>: p = 0.05</text>
<text x="812.0" y="194.0" font-size="12" fill="#555555" text-anchor="middle"><tspan fill="#0072B2">H0</tspan> hands you the number.</text>
<text x="812.0" y="216.0" font-size="12.5" fill="#222222" text-anchor="middle">SE = √( pq / n ) with p = 0.05</text>
<text x="812.0" y="242.0" font-size="12" fill="#555555" text-anchor="middle">Nothing to estimate.</text>
<rect x="675.0" y="285.0" width="275.0" height="203.0" rx="8" fill="#EEF5FB" stroke="#0072B2" stroke-width="1.5"/>
<text x="812.0" y="312.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">Two proportions (this lesson)</text>
<text x="812.0" y="336.0" font-size="12.5" fill="#222222" text-anchor="middle"><tspan fill="#0072B2">H0</tspan>: p₁ = p₂</text>
<text x="812.0" y="358.0" font-size="12" fill="#555555" text-anchor="middle">"Equal", but equal to what?</text>
<text x="812.0" y="380.0" font-size="12" fill="#555555" text-anchor="middle"><tspan fill="#0072B2">H0</tspan> gives no number to plug in.</text>
<text x="812.0" y="408.0" font-size="12.5" fill="#222222" text-anchor="middle">So estimate the shared rate</text>
<text x="812.0" y="428.0" font-size="12.5" fill="#222222" text-anchor="middle">from both groups combined:</text>
<text x="812.0" y="454.0" font-size="13.5" fill="#222222" text-anchor="middle" font-weight="bold">p̄ = (x₁ + x₂) / (n₁ + n₂)</text>
</svg>
