<circle cx="430.7" cy="200.0" r="6" fill="#009E73" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="366.0" cy="200.0" r="6" fill="#009E73" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="213.6" cy="200.0" r="6" fill="#009E73" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="286.0" cy="200.0" r="6" fill="#009E73" stroke="#ffffff" stroke-width="1.5"/>
<line x1="242.1" y1="176.0" x2="242.1" y2="224.0" stroke="#009E73" stroke-width="2.5"/>
<text x="242.1" y="171.0" font-size="11" fill="#009E73" text-anchor="middle" font-weight="bold">mean 206.5</text>
<line x1="65.0" y1="268.0" x2="465.0" y2="268.0" stroke="#E1E4E8" stroke-width="1"/>
<text x="58.0" y="272.0" font-size="12.5" fill="#8E44AD" text-anchor="end" font-weight="bold">After</text>
<circle cx="99.3" cy="268.0" r="6" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="167.9" cy="268.0" r="6" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="190.7" cy="268.0" r="6" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="126.0" cy="268.0" r="6" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="194.5" cy="257.0" r="6" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="106.9" cy="257.0" r="6" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="324.0" cy="268.0" r="6" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="282.1" cy="268.0" r="6" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="232.6" cy="268.0" r="6" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="198.3" cy="279.0" r="6" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<line x1="192.2" y1="244.0" x2="192.2" y2="292.0" stroke="#8E44AD" stroke-width="2.5"/>
<text x="192.2" y="239.0" font-size="11" fill="#8E44AD" text-anchor="middle" font-weight="bold">mean 193.4</text>
<line x1="65.0" y1="300.0" x2="465.0" y2="300.0" stroke="#555555" stroke-width="1.3"/>
<line x1="65.0" y1="300.0" x2="65.0" y2="305.0" stroke="#555555" stroke-width="1"/>
<text x="65.0" y="318.0" font-size="11" fill="#555555" text-anchor="middle">160</text>
<line x1="141.2" y1="300.0" x2="141.2" y2="305.0" stroke="#555555" stroke-width="1"/>
<text x="141.2" y="318.0" font-size="11" fill="#555555" text-anchor="middle">180</text>
<line x1="217.4" y1="300.0" x2="217.4" y2="305.0" stroke="#555555" stroke-width="1"/>
<text x="217.4" y="318.0" font-size="11" fill="#555555" text-anchor="middle">200</text>
<line x1="293.6" y1="300.0" x2="293.6" y2="305.0" stroke="#555555" stroke-width="1"/>
<text x="293.6" y="318.0" font-size="11" fill="#555555" text-anchor="middle">220</text>
<line x1="369.8" y1="300.0" x2="369.8" y2="305.0" stroke="#555555" stroke-width="1"/>
<text x="369.8" y="318.0" font-size="11" fill="#555555" text-anchor="middle">240</text>
<line x1="446.0" y1="300.0" x2="446.0" y2="305.0" stroke="#555555" stroke-width="1"/>
<text x="446.0" y="318.0" font-size="11" fill="#555555" text-anchor="middle">260</text>
<text x="265.0" y="336.0" font-size="11.5" fill="#555555" text-anchor="middle">weight (lb)</text>
<line x1="95.5" y1="152.0" x2="430.7" y2="152.0" stroke="#222222" stroke-width="1.3" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="263.1" y="146.0" font-size="11.5" fill="#222222" text-anchor="middle">people range from 168 to 256 lb (SD ≈ 28)</text>
<rect x="45.0" y="357.0" width="440.0" height="78.0" rx="8" fill="#F7F9FB" stroke="#1F4E79" stroke-width="1.5"/>
<text x="265.0" y="380.0" font-size="12.5" fill="#222222" text-anchor="middle">SE = √(28.0²/10 + 19.2²/10) = 10.7</text>
<text x="265.0" y="400.0" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="bold">t = −13.1 / 10.7 = −1.22   (critical ≈ −1.75)</text>
<text x="265.0" y="421.0" font-size="13" fill="#1F4E79" text-anchor="middle" font-weight="bold">not far enough → fail to reject <tspan fill="#0072B2">H0</tspan></text>
<text x="745.0" y="100.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">Right: subtract each person from themself</text>
<text x="745.0" y="120.0" font-size="12" fill="#555555" text-anchor="middle">difference = after − before cancels out who is heavy or light</text>
<line x1="857.9" y1="160.0" x2="857.9" y2="300.0" stroke="#555555" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="861.9" y="172.0" font-size="11" fill="#555555" text-anchor="start">no change</text>
<line x1="560.0" y1="225.0" x2="960.0" y2="225.0" stroke="#E1E4E8" stroke-width="1"/>
<circle cx="721.7" cy="225.0" r="6" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="815.3" cy="225.0" r="6" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="747.2" cy="225.0" r="6" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="849.4" cy="225.0" r="6" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="594.0" cy="225.0" r="6" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="883.4" cy="225.0" r="6" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="619.6" cy="225.0" r="6" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="670.6" cy="225.0" r="6" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="900.4" cy="225.0" r="6" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="662.1" cy="214.0" r="6" fill="#C0392B" stroke="#ffffff" stroke-width="1.5"/>
<line x1="746.4" y1="197.0" x2="746.4" y2="253.0" stroke="#C0392B" stroke-width="2.5"/>
<text x="746.4" y="190.0" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="bold">mean −13.1</text>
<line x1="560.0" y1="300.0" x2="960.0" y2="300.0" stroke="#555555" stroke-width="1.3"/>
<line x1="602.6" y1="300.0" x2="602.6" y2="305.0" stroke="#555555" stroke-width="1"/>
<text x="602.6" y="318.0" font-size="11" fill="#555555" text-anchor="middle">−30</text>
<line x1="687.7" y1="300.0" x2="687.7" y2="305.0" stroke="#555555" stroke-width="1"/>
<text x="687.7" y="318.0" font-size="11" fill="#555555" text-anchor="middle">−20</text>
<line x1="772.8" y1="300.0" x2="772.8" y2="305.0" stroke="#555555" stroke-width="1"/>
<text x="772.8" y="318.0" font-size="11" fill="#555555" text-anchor="middle">−10</text>
<line x1="857.9" y1="300.0" x2="857.9" y2="305.0" stroke="#555555" stroke-width="1"/>
<text x="857.9" y="318.0" font-size="11" fill="#555555" text-anchor="middle">0</text>
<line x1="943.0" y1="300.0" x2="943.0" y2="305.0" stroke="#555555" stroke-width="1"/>
<text x="943.0" y="318.0" font-size="11" fill="#555555" text-anchor="middle">10</text>
<text x="745.0" y="336.0" font-size="11.5" fill="#555555" text-anchor="middle">difference, after − before (lb)</text>
<text x="704.7" y="280.0" font-size="11.5" fill="#222222" text-anchor="middle">differences: SD ≈ 13, not 28</text>
<rect x="515.0" y="357.0" width="440.0" height="78.0" rx="8" fill="#F7F9FB" stroke="#C0392B" stroke-width="1.5"/>
<text x="735.0" y="380.0" font-size="12.5" fill="#222222" text-anchor="middle">SE = 13.0 / √10 = 4.12</text>
<text x="735.0" y="400.0" font-size="12.5" fill="#222222" text-anchor="middle" font-weight="bold">t = −13.1 / 4.12 = −3.18   (critical −1.833)</text>
<text x="735.0" y="421.0" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="bold">beyond the line → reject <tspan fill="#0072B2">H0</tspan></text>
<line x1="500.0" y1="85.0" x2="500.0" y2="437.0" stroke="#E1E4E8" stroke-width="1"/>
<text x="500.0" y="467.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">Same 10 people, same −13.1 lb average change. Only the noise in the denominator is different.</text>
<text x="500.0" y="487.0" font-size="12.5" fill="#555555" text-anchor="middle">Pairing removes the person-to-person spread, so the real effect stands out. That is why paired data needs the paired test.</text>
</svg>
