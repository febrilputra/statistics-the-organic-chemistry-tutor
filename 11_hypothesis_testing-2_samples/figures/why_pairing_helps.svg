<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="507" viewBox="0 0 1000 507" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">Same data, two analyses: why pairing helps</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">Weight-loss program, 10 people weighed before and after. The program effect is about 13 lb.</text>
<text x="265.0" y="100.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">Wrong: treat as two separate groups</text>
<text x="265.0" y="120.0" font-size="12" fill="#555555" text-anchor="middle">person-to-person differences swamp the effect</text>
<line x1="65.0" y1="200.0" x2="465.0" y2="200.0" stroke="#E1E4E8" stroke-width="1"/>
<text x="58.0" y="204.0" font-size="12.5" fill="#009E73" text-anchor="end" font-weight="bold">Before</text>
<circle cx="160.2" cy="200.0" r="6" fill="#009E73" stroke="#ffffff" stroke-width="1.5"/>
<circle cx="186.9" cy="200.0" r="6" fill="#009E73" stroke="#ffffff" stroke-width="1.5"/>
