<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">Population vs sample, parameter vs statistic</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">Parameters describe the whole population (Greek letters). Statistics describe the sample we actually measured.</text>
<ellipse cx="330.0" cy="270.0" rx="290.0" ry="165.0" stroke="#0072B2" stroke-width="2.5" fill="#E8F1F9"/>
<ellipse cx="450.0" cy="300.0" rx="120.0" ry="80.0" stroke="#D55E00" stroke-width="2.5" fill="#FDEEE3"/>
<text x="205.0" y="160.0" font-size="17" fill="#0072B2" text-anchor="middle" font-weight="bold">POPULATION</text>
<text x="205.0" y="184.0" font-size="13" fill="#0072B2" text-anchor="middle">everyone in town XYZ</text>
<text x="205.0" y="220.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">N = 100,000</text>
<text x="205.0" y="262.0" font-size="13" fill="#555555" text-anchor="middle">parameters:</text>
<text x="205.0" y="292.0" font-size="22" fill="#0072B2" text-anchor="middle" font-weight="bold">μ   σ   σ²   p</text>
<text x="205.0" y="330.0" font-size="12.5" fill="#555555" text-anchor="middle">true mean age μ: unknown</text>
<text x="450.0" y="262.0" font-size="16" fill="#D55E00" text-anchor="middle" font-weight="bold">SAMPLE</text>
<text x="450.0" y="286.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">n = 100 residents</text>
<text x="450.0" y="318.0" font-size="22" fill="#D55E00" text-anchor="middle" font-weight="bold">x̄   s   s²   p̂</text>
<text x="450.0" y="344.0" font-size="12.5" fill="#555555" text-anchor="middle">statistics</text>
<rect x="680.0" y="120.0" width="290.0" height="100.0" rx="10" stroke="#222222" stroke-width="2" fill="#FFFFFF"/>
<text x="825.0" y="146.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">Memory aid</text>
<text x="825.0" y="170.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="normal">Parameter ↔ Population</text>
<text x="825.0" y="190.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="normal">Statistic ↔ Sample</text>
<rect x="680.0" y="250.0" width="290.0" height="130.0" rx="10" stroke="#D55E00" stroke-width="2" fill="#FFFFFF"/>
<text x="825.0" y="276.0" font-size="15" fill="#D55E00" text-anchor="middle" font-weight="bold">How they are used</text>
<text x="825.0" y="300.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">compute the statistic x̄ from</text>
<text x="825.0" y="320.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">the 100 people we asked, and</text>
<text x="825.0" y="340.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">use it to estimate the</text>
<text x="825.0" y="360.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="normal">parameter μ for all 100,000</text>
<line x1="572.0" y1="300.0" x2="676.0" y2="315.0" stroke="#D55E00" stroke-width="2" fill="none"/>
<polygon points="676.0,315.0 667.3,317.3 668.3,310.3" stroke="none" fill="#D55E00"/>
</svg>
