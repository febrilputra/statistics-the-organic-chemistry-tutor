<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">The four scales of measurement (NOIR)</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">Each scale adds one property: order (ordinal), equal differences (interval), and a true zero that makes ratios meaningful (ratio).</text>
<line x1="80.0" y1="270.0" x2="440.0" y2="270.0" stroke="#E6E6E6" stroke-width="1" fill="none"/>
<line x1="80.0" y1="245.0" x2="440.0" y2="245.0" stroke="#E6E6E6" stroke-width="1" fill="none"/>
<line x1="80.0" y1="220.0" x2="440.0" y2="220.0" stroke="#E6E6E6" stroke-width="1" fill="none"/>
<line x1="80.0" y1="195.0" x2="440.0" y2="195.0" stroke="#E6E6E6" stroke-width="1" fill="none"/>
<line x1="80.0" y1="170.0" x2="440.0" y2="170.0" stroke="#E6E6E6" stroke-width="1" fill="none"/>
<line x1="80.0" y1="145.0" x2="440.0" y2="145.0" stroke="#E6E6E6" stroke-width="1" fill="none"/>
<text x="260.0" y="108.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">1. Nominal: favorite color</text>
<rect x="104.0" y="145.0" width="72.0" height="125.0" stroke="#C0392B" stroke-width="1.3" fill="#C0392B" fill-opacity="0.85"/>
<text x="140.0" y="140.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">50%</text>
<rect x="224.0" y="195.0" width="72.0" height="75.0" stroke="#0072B2" stroke-width="1.3" fill="#0072B2" fill-opacity="0.85"/>
<text x="260.0" y="190.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">30%</text>
<rect x="344.0" y="220.0" width="72.0" height="50.0" stroke="#009E73" stroke-width="1.3" fill="#009E73" fill-opacity="0.85"/>
<text x="380.0" y="215.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">20%</text>
<line x1="80.0" y1="270.0" x2="440.0" y2="270.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="80.0" y1="120.0" x2="80.0" y2="270.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="140.0" y1="270.0" x2="140.0" y2="275.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="140.0" y="289.0" font-size="11" fill="#555555" text-anchor="middle">Red</text>
<line x1="260.0" y1="270.0" x2="260.0" y2="275.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="260.0" y="289.0" font-size="11" fill="#555555" text-anchor="middle">Blue</text>
<line x1="380.0" y1="270.0" x2="380.0" y2="275.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="380.0" y="289.0" font-size="11" fill="#555555" text-anchor="middle">Green</text>
<line x1="75.0" y1="270.0" x2="80.0" y2="270.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="72.0" y="274.0" font-size="11" fill="#555555" text-anchor="end">0</text>
<line x1="75.0" y1="245.0" x2="80.0" y2="245.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="72.0" y="249.0" font-size="11" fill="#555555" text-anchor="end">1</text>
<line x1="75.0" y1="220.0" x2="80.0" y2="220.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="72.0" y="224.0" font-size="11" fill="#555555" text-anchor="end">2</text>
<line x1="75.0" y1="195.0" x2="80.0" y2="195.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="72.0" y="199.0" font-size="11" fill="#555555" text-anchor="end">3</text>
<line x1="75.0" y1="170.0" x2="80.0" y2="170.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="72.0" y="174.0" font-size="11" fill="#555555" text-anchor="end">4</text>
<line x1="75.0" y1="145.0" x2="80.0" y2="145.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="72.0" y="149.0" font-size="11" fill="#555555" text-anchor="end">5</text>
<text x="34.0" y="195.0" font-size="13" fill="#555555" text-anchor="middle" transform="rotate(-90 34.0 195.0)">count</text>
<text x="260.0" y="318.0" font-size="12.5" fill="#555555" text-anchor="middle">labels only: the order of the bars is arbitrary,</text>
<text x="260.0" y="336.0" font-size="12.5" fill="#555555" text-anchor="middle">you can only count each category</text>
<text x="750.0" y="108.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">2. Ordinal: race places</text>
<line x1="625.4" y1="150.0" x2="593.1" y2="262.5" stroke="#888888" stroke-width="1.4" stroke-dasharray="4,3" fill="none"/>
<circle cx="625.4" cy="150.0" r="13.0" stroke="none" fill="#7B4FA0"/>
<text x="625.4" y="154.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold">1st</text>
<circle cx="593.1" cy="262.5" r="5.0" stroke="none" fill="#222222"/>
<line x1="750.0" y1="150.0" x2="602.3" y2="262.5" stroke="#888888" stroke-width="1.4" stroke-dasharray="4,3" fill="none"/>
<circle cx="750.0" cy="150.0" r="13.0" stroke="none" fill="#7B4FA0"/>
<text x="750.0" y="154.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold">2nd</text>
<circle cx="602.3" cy="262.5" r="5.0" stroke="none" fill="#222222"/>
<line x1="874.6" y1="150.0" x2="911.5" y2="262.5" stroke="#888888" stroke-width="1.4" stroke-dasharray="4,3" fill="none"/>
<circle cx="874.6" cy="150.0" r="13.0" stroke="none" fill="#7B4FA0"/>
<text x="874.6" y="154.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="bold">3rd</text>
<circle cx="911.5" cy="262.5" r="5.0" stroke="none" fill="#222222"/>
<text x="930.0" y="130.0" font-size="11.5" fill="#7B4FA0" text-anchor="end">evenly spaced ranks</text>
<text x="597.7" y="289.0" font-size="11" fill="#555555" text-anchor="middle">4:53, 4:55</text>
<text x="754.6" y="252.5" font-size="11.5" fill="#222222" text-anchor="middle">real times: 2 s gap, then 67 s gap</text>
<line x1="570.0" y1="270.0" x2="930.0" y2="270.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="593.1" y1="270.0" x2="593.1" y2="275.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="593.1" y="289.0" font-size="11" fill="#555555" text-anchor="middle"></text>
<line x1="602.3" y1="270.0" x2="602.3" y2="275.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="602.3" y="289.0" font-size="11" fill="#555555" text-anchor="middle"></text>
<line x1="911.5" y1="270.0" x2="911.5" y2="275.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="911.5" y="289.0" font-size="11" fill="#555555" text-anchor="middle">6:02</text>
<text x="750.0" y="318.0" font-size="12.5" fill="#555555" text-anchor="middle">order matters, but the ranks hide</text>
<text x="750.0" y="336.0" font-size="12.5" fill="#555555" text-anchor="middle">how big the differences are</text>
<text x="260.0" y="408.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">3. Interval: temperature in °F</text>
<line x1="80.0" y1="497.0" x2="440.0" y2="497.0" stroke="#D55E00" stroke-width="3" fill="none"/>
<circle cx="260.0" cy="497.0" r="6.0" stroke="none" fill="#D55E00"/>
<circle cx="332.0" cy="497.0" r="6.0" stroke="none" fill="#D55E00"/>
<circle cx="404.0" cy="497.0" r="6.0" stroke="none" fill="#D55E00"/>
<line x1="260.0" y1="466.8" x2="332.0" y2="466.8" stroke="#222222" stroke-width="1.5" fill="none"/>
<line x1="260.0" y1="472.2" x2="260.0" y2="461.2" stroke="#222222" stroke-width="1.5" fill="none"/>
<line x1="332.0" y1="472.2" x2="332.0" y2="461.2" stroke="#222222" stroke-width="1.5" fill="none"/>
<text x="296.0" y="460.8" font-size="11.5" fill="#222222" text-anchor="middle" font-weight="bold">30°</text>
<line x1="332.0" y1="466.8" x2="404.0" y2="466.8" stroke="#222222" stroke-width="1.5" fill="none"/>
<line x1="332.0" y1="472.2" x2="332.0" y2="461.2" stroke="#222222" stroke-width="1.5" fill="none"/>
<line x1="404.0" y1="472.2" x2="404.0" y2="461.2" stroke="#222222" stroke-width="1.5" fill="none"/>
<text x="368.0" y="460.8" font-size="11.5" fill="#222222" text-anchor="middle" font-weight="bold">30°</text>
<line x1="188.0" y1="530.0" x2="188.0" y2="442.0" stroke="#C0392B" stroke-width="2" stroke-dasharray="5,3" fill="none"/>
<text x="184.0" y="446.0" font-size="11.5" fill="#C0392B" text-anchor="end" font-weight="bold">0 °F is not "no heat"</text>
<line x1="80.0" y1="530.0" x2="440.0" y2="530.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="92.0" y1="530.0" x2="92.0" y2="535.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="92.0" y="549.0" font-size="11" fill="#555555" text-anchor="middle">−40</text>
<line x1="188.0" y1="530.0" x2="188.0" y2="535.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="188.0" y="549.0" font-size="11" fill="#555555" text-anchor="middle">0</text>
<line x1="260.0" y1="530.0" x2="260.0" y2="535.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="260.0" y="549.0" font-size="11" fill="#555555" text-anchor="middle">30</text>
<line x1="332.0" y1="530.0" x2="332.0" y2="535.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="332.0" y="549.0" font-size="11" fill="#555555" text-anchor="middle">60</text>
<line x1="404.0" y1="530.0" x2="404.0" y2="535.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="404.0" y="549.0" font-size="11" fill="#555555" text-anchor="middle">90</text>
<text x="260.0" y="588.0" font-size="12.5" fill="#555555" text-anchor="middle">equal differences are meaningful, but 60 °F</text>
<text x="260.0" y="606.0" font-size="12.5" fill="#555555" text-anchor="middle">is not "twice as hot" as 30 °F (no true zero)</text>
<text x="750.0" y="408.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">4. Ratio: exam scores</text>
<rect x="570.0" y="442.0" width="108.0" height="22.0" stroke="#009E73" stroke-width="1.3" fill="#009E73" fill-opacity="0.8"/>
<rect x="570.0" y="482.3" width="324.0" height="22.0" stroke="#009E73" stroke-width="1.3" fill="#009E73" fill-opacity="0.8"/>
<text x="684.0" y="458.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">30</text>
<text x="888.0" y="498.3" font-size="12" fill="#ffffff" text-anchor="end" font-weight="bold">90 = 3 × 30</text>
<text x="572.0" y="429.2" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="bold">true zero: 0 = no correct answers</text>
<line x1="570.0" y1="530.0" x2="930.0" y2="530.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="570.0" y1="530.0" x2="570.0" y2="535.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="570.0" y="549.0" font-size="11" fill="#555555" text-anchor="middle">0</text>
<line x1="678.0" y1="530.0" x2="678.0" y2="535.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="678.0" y="549.0" font-size="11" fill="#555555" text-anchor="middle">30</text>
<line x1="771.6" y1="530.0" x2="771.6" y2="535.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="771.6" y="549.0" font-size="11" fill="#555555" text-anchor="middle">56</text>
<line x1="822.0" y1="530.0" x2="822.0" y2="535.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="822.0" y="549.0" font-size="11" fill="#555555" text-anchor="middle">70</text>
<line x1="894.0" y1="530.0" x2="894.0" y2="535.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="894.0" y="549.0" font-size="11" fill="#555555" text-anchor="middle">90</text>
<text x="750.0" y="588.0" font-size="12.5" fill="#555555" text-anchor="middle">zero means none, so ratios like</text>
<text x="750.0" y="606.0" font-size="12.5" fill="#555555" text-anchor="middle">"three times as much" make sense</text>
</svg>
