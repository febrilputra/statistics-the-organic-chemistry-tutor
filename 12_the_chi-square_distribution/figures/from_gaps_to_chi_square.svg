<text x="500.0" y="432.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">χ² = Σ (O − E)² / E</text>
<text x="500.0" y="454.0" font-size="12.5" fill="#555555" text-anchor="middle">χ² = 0 is a perfect fit, and it can never be negative. Only a large χ² counts against H0,</text>
<text x="500.0" y="472.0" font-size="12.5" fill="#555555" text-anchor="middle">so the rejection region is always the right tail.</text>
