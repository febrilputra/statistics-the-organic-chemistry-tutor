<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">From five gaps to one number: χ²</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">Teacher absences by weekday. If H0 is true, each day should get 100 / 5 = 20.</text>
<text x="170.0" y="96.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">1. The gaps O − E</text>
