<text x="170.0" y="371.0" font-size="11.5" fill="#555555" text-anchor="middle">always 0, so plain gaps are useless</text>
<text x="500.0" y="96.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">2. Square, then divide by E</text>
<text x="500.0" y="115.0" font-size="12" fill="#555555" text-anchor="middle">all positive, and sized relative to 20</text>
