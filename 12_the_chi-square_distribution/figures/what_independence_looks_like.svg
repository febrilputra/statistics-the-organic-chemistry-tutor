<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">What would “no relationship” look like?</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">Study time for 310 freshmen and 320 seniors. Independent means every row has the same split.</text>
<text x="175.0" y="96.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">1. Observed split</text>
<text x="175.0" y="115.0" font-size="12" fill="#555555" text-anchor="middle">each row as percentages of its own total</text>
<text x="40.0" y="142.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">Freshmen</text>
<rect x="40.0" y="150.0" width="66.2" height="34.0" fill="#009E73" stroke="#ffffff" stroke-width="1.5"/>
<text x="73.1" y="171.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">25%</text>
<rect x="106.2" y="150.0" width="124.5" height="34.0" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<text x="168.5" y="171.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">46%</text>
<rect x="230.7" y="150.0" width="79.3" height="34.0" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<text x="270.4" y="171.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">29%</text>
<text x="40.0" y="207.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">Seniors</text>
<rect x="40.0" y="215.0" width="124.0" height="34.0" fill="#009E73" stroke="#ffffff" stroke-width="1.5"/>
<text x="102.0" y="236.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">46%</text>
<rect x="164.0" y="215.0" width="92.0" height="34.0" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<text x="210.0" y="236.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">34%</text>
<rect x="256.0" y="215.0" width="54.0" height="34.0" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<text x="283.0" y="236.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">20%</text>
<text x="175.0" y="278.0" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">the rows look different:</text>
<text x="175.0" y="295.0" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">25% vs 46% study only 0–2 h</text>
<text x="500.0" y="96.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">2. Expected if independent</text>
<text x="500.0" y="115.0" font-size="12" fill="#555555" text-anchor="middle">both rows copy the split of all 630</text>
<text x="365.0" y="142.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">Freshmen</text>
<rect x="365.0" y="150.0" width="95.6" height="34.0" fill="#009E73" stroke="#ffffff" stroke-width="1.5"/>
<text x="412.8" y="171.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">35%</text>
<rect x="460.6" y="150.0" width="108.0" height="34.0" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<text x="514.6" y="171.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">40%</text>
<rect x="568.6" y="150.0" width="66.4" height="34.0" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<text x="601.8" y="171.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">25%</text>
<text x="365.0" y="207.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">Seniors</text>
<rect x="365.0" y="215.0" width="95.6" height="34.0" fill="#009E73" stroke="#ffffff" stroke-width="1.5"/>
<text x="412.8" y="236.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">35%</text>
<rect x="460.6" y="215.0" width="108.0" height="34.0" fill="#8E44AD" stroke="#ffffff" stroke-width="1.5"/>
<text x="514.6" y="236.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">40%</text>
<rect x="568.6" y="215.0" width="66.4" height="34.0" fill="#E69F00" stroke="#ffffff" stroke-width="1.5"/>
<text x="601.8" y="236.5" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">25%</text>
<text x="500.0" y="278.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">223 / 630 = 35.4% study 0–2 h,</text>
<text x="500.0" y="295.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">so expect 35.4% of 310 = 109.7</text>
<text x="230.0" y="330.0" font-size="12" fill="#555555" text-anchor="end">study time per day:</text>
<rect x="242.0" y="318" width="14" height="14" fill="#009E73"/>
<text x="262.0" y="330.0" font-size="12" fill="#222222" text-anchor="start">0–2 h</text>
<rect x="327.0" y="318" width="14" height="14" fill="#8E44AD"/>
<text x="347.0" y="330.0" font-size="12" fill="#222222" text-anchor="start">2–4 h</text>
<rect x="412.0" y="318" width="14" height="14" fill="#E69F00"/>
<text x="432.0" y="330.0" font-size="12" fill="#222222" text-anchor="start">4–6 h</text>
<text x="830.0" y="96.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">3. Why df = (2 − 1)(3 − 1) = 2</text>
<text x="830.0" y="115.0" font-size="12" fill="#555555" text-anchor="middle">with the totals fixed, only 2 cells are free</text>
<rect x="700.0" y="140.0" width="62" height="40" fill="#FFF3D6" stroke="#E69F00" stroke-width="1.5"/>
<text x="731.0" y="165.0" font-size="12.5" fill="#B36B00" text-anchor="middle" font-weight="bold">free</text>
<rect x="762.0" y="140.0" width="62" height="40" fill="#FFF3D6" stroke="#E69F00" stroke-width="1.5"/>
<text x="793.0" y="165.0" font-size="12.5" fill="#B36B00" text-anchor="middle" font-weight="bold">free</text>
<rect x="824.0" y="140.0" width="62" height="40" fill="#EEF1F4" stroke="#C5CCD3" stroke-width="1.5"/>
<text x="855.0" y="165.0" font-size="12.5" fill="#555555" text-anchor="middle">forced</text>
<rect x="700.0" y="180.0" width="62" height="40" fill="#EEF1F4" stroke="#C5CCD3" stroke-width="1.5"/>
<text x="731.0" y="205.0" font-size="12.5" fill="#555555" text-anchor="middle">forced</text>
<rect x="762.0" y="180.0" width="62" height="40" fill="#EEF1F4" stroke="#C5CCD3" stroke-width="1.5"/>
<text x="793.0" y="205.0" font-size="12.5" fill="#555555" text-anchor="middle">forced</text>
<rect x="824.0" y="180.0" width="62" height="40" fill="#EEF1F4" stroke="#C5CCD3" stroke-width="1.5"/>
<text x="855.0" y="205.0" font-size="12.5" fill="#555555" text-anchor="middle">forced</text>
<text x="894.0" y="165.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">310</text>
<text x="894.0" y="205.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold">320</text>
<text x="731.0" y="238.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">223</text>
<text x="793.0" y="238.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">252</text>
<text x="855.0" y="238.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">155</text>
<text x="894.0" y="238.0" font-size="12" fill="#555555" text-anchor="start">630</text>
<text x="830.0" y="272.0" font-size="11.5" fill="#555555" text-anchor="middle">Fill in 2 cells of the top row. The third</text>
<text x="830.0" y="288.0" font-size="11.5" fill="#555555" text-anchor="middle">must bring the row to 310, and each senior</text>
<text x="830.0" y="304.0" font-size="11.5" fill="#555555" text-anchor="middle">cell must bring its column to its total.</text>
<line x1="338.0" y1="85.0" x2="338.0" y2="300.0" stroke="#E1E4E8" stroke-width="1"/>
<line x1="662.0" y1="85.0" x2="662.0" y2="312.0" stroke="#E1E4E8" stroke-width="1"/>
<rect x="60.0" y="360.0" width="880.0" height="120.0" rx="8" fill="#FFFFFF" stroke="#222222" stroke-width="1.5"/>
<text x="500.0" y="388.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">E = (row total × column total) / grand total</text>
<text x="500.0" y="412.0" font-size="12.5" fill="#555555" text-anchor="middle">Freshmen, 0–2 h:  E = 310 × 223 / 630 = 109.7   (the same as 35.4% of 310)</text>
<text x="500.0" y="436.0" font-size="12.5" fill="#555555" text-anchor="middle">Then χ² = Σ (O − E)² / E over all 6 cells measures how far the real table is from the “independent” table.</text>
<text x="500.0" y="462.0" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="bold">χ² ≈ 32.3, far beyond 5.99 (df 2) → reject <tspan fill="#0072B2">H0</tspan>: study time depends on student type</text>
</svg>
