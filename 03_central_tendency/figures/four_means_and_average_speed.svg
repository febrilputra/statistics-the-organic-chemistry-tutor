<text x="582.0" y="364.0" font-size="12" fill="#555555" text-anchor="end">0</text>
<line x1="585.0" y1="314.0" x2="590.0" y2="314.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="582.0" y="318.0" font-size="12" fill="#555555" text-anchor="end">20</text>
<line x1="585.0" y1="268.0" x2="590.0" y2="268.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="582.0" y="272.0" font-size="12" fill="#555555" text-anchor="end">40</text>
<line x1="585.0" y1="245.0" x2="590.0" y2="245.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="582.0" y="249.0" font-size="12" fill="#555555" text-anchor="end">50</text>
<line x1="585.0" y1="222.0" x2="590.0" y2="222.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="582.0" y="226.0" font-size="12" fill="#555555" text-anchor="end">60</text>
<line x1="585.0" y1="176.0" x2="590.0" y2="176.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="582.0" y="180.0" font-size="12" fill="#555555" text-anchor="end">80</text>
<line x1="585.0" y1="130.0" x2="590.0" y2="130.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="582.0" y="134.0" font-size="12" fill="#555555" text-anchor="end">100</text>
<text x="770.0" y="402.0" font-size="13" fill="#555555" text-anchor="middle">Hours</text>
<text x="550.0" y="245.0" font-size="13" fill="#555555" text-anchor="middle" transform="rotate(-90 550.0 245.0)">Speed (mph)</text>
