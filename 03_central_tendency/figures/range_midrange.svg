<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="450.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">Range, midrange and coefficient of range use only the two extremes</text>
<text x="450.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">Lowest L = 5, highest H = 45.</text>
<circle cx="146.0" cy="177.5" r="9.0" stroke="none" fill="#0072B2"/>
<circle cx="754.0" cy="177.5" r="9.0" stroke="none" fill="#0072B2"/>
<text x="146.0" y="161.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">L = 5</text>
<text x="754.0" y="161.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">H = 45</text>
<line x1="146.0" y1="132.5" x2="754.0" y2="132.5" stroke="#009E73" stroke-width="3" fill="none"/>
<line x1="146.0" y1="141.5" x2="146.0" y2="123.5" stroke="#009E73" stroke-width="3" fill="none"/>
<line x1="754.0" y1="141.5" x2="754.0" y2="123.5" stroke="#009E73" stroke-width="3" fill="none"/>
<text x="450.0" y="122.5" font-size="13" fill="#009E73" text-anchor="middle" font-weight="bold">range = H - L = 40</text>
<polygon points="450.0,226.0 441.0,241.0 459.0,241.0" stroke="none" fill="#C0392B"/>
<text x="450.0" y="260.0" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="bold">midrange = (H + L)/2 = 25</text>
<line x1="70.0" y1="200.0" x2="830.0" y2="200.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="70.0" y1="200.0" x2="70.0" y2="205.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="70.0" y="219.0" font-size="12" fill="#555555" text-anchor="middle">0</text>
<line x1="146.0" y1="200.0" x2="146.0" y2="205.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="146.0" y="219.0" font-size="12" fill="#555555" text-anchor="middle">5</text>
<line x1="222.0" y1="200.0" x2="222.0" y2="205.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="222.0" y="219.0" font-size="12" fill="#555555" text-anchor="middle">10</text>
<line x1="298.0" y1="200.0" x2="298.0" y2="205.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="298.0" y="219.0" font-size="12" fill="#555555" text-anchor="middle">15</text>
<line x1="374.0" y1="200.0" x2="374.0" y2="205.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="374.0" y="219.0" font-size="12" fill="#555555" text-anchor="middle">20</text>
<line x1="450.0" y1="200.0" x2="450.0" y2="205.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="450.0" y="219.0" font-size="12" fill="#555555" text-anchor="middle">25</text>
<line x1="526.0" y1="200.0" x2="526.0" y2="205.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="526.0" y="219.0" font-size="12" fill="#555555" text-anchor="middle">30</text>
<line x1="602.0" y1="200.0" x2="602.0" y2="205.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="602.0" y="219.0" font-size="12" fill="#555555" text-anchor="middle">35</text>
<line x1="678.0" y1="200.0" x2="678.0" y2="205.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="678.0" y="219.0" font-size="12" fill="#555555" text-anchor="middle">40</text>
<line x1="754.0" y1="200.0" x2="754.0" y2="205.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="754.0" y="219.0" font-size="12" fill="#555555" text-anchor="middle">45</text>
<line x1="830.0" y1="200.0" x2="830.0" y2="205.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="830.0" y="219.0" font-size="12" fill="#555555" text-anchor="middle">50</text>
<text x="450.0" y="285.0" font-size="14" fill="#7B4FA0" text-anchor="middle" font-weight="bold">coefficient of range = (H - L)/(H + L) = 40/50 = 0.8</text>
</svg>
