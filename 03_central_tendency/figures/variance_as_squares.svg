<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">Variance adds up squared deviations: literally squares</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">Both sets have mean 8. Each square has side |x - 8|, so its area is (x - 8) squared.</text>
<text x="270.0" y="98.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">Set 1: 6, 7, 8, 9, 10</text>
<rect x="200.0" y="300.0" width="70.0" height="70.0" stroke="#D55E00" stroke-width="1.5" fill="#D55E00" fill-opacity="0.25"/>
<rect x="235.0" y="335.0" width="35.0" height="35.0" stroke="#D55E00" stroke-width="1.5" fill="#D55E00" fill-opacity="0.25"/>
<rect x="270.0" y="335.0" width="35.0" height="35.0" stroke="#0072B2" stroke-width="1.5" fill="#0072B2" fill-opacity="0.25"/>
<rect x="270.0" y="300.0" width="70.0" height="70.0" stroke="#0072B2" stroke-width="1.5" fill="#0072B2" fill-opacity="0.25"/>
<line x1="270.0" y1="390.0" x2="270.0" y2="114.0" stroke="#C0392B" stroke-width="2" stroke-dasharray="6,4" fill="none"/>
