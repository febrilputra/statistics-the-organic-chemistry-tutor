<line x1="60.0" y1="390.0" x2="480.0" y2="390.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="60.0" y1="390.0" x2="60.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="60.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">2</text>
<line x1="130.0" y1="390.0" x2="130.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="130.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">4</text>
<line x1="200.0" y1="390.0" x2="200.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="200.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">6</text>
<line x1="270.0" y1="390.0" x2="270.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="270.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">8</text>
<line x1="340.0" y1="390.0" x2="340.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="340.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">10</text>
<line x1="410.0" y1="390.0" x2="410.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="410.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">12</text>
<line x1="480.0" y1="390.0" x2="480.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="480.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">14</text>
<text x="270.0" y="450.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">4 + 1 + 0 + 1 + 4 = 10, variance = 10/4 = 2.5</text>
<text x="750.0" y="98.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">Set 2: 4, 6, 8, 10, 12</text>
<rect x="610.0" y="230.0" width="140.0" height="140.0" stroke="#D55E00" stroke-width="1.5" fill="#D55E00" fill-opacity="0.25"/>
