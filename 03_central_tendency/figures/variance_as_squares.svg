<line x1="540.0" y1="390.0" x2="540.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="540.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">2</text>
<line x1="610.0" y1="390.0" x2="610.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="610.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">4</text>
<line x1="680.0" y1="390.0" x2="680.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="680.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">6</text>
<line x1="750.0" y1="390.0" x2="750.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="750.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">8</text>
<line x1="820.0" y1="390.0" x2="820.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="820.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">10</text>
<line x1="890.0" y1="390.0" x2="890.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="890.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">12</text>
<line x1="960.0" y1="390.0" x2="960.0" y2="395.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="960.0" y="409.0" font-size="12" fill="#555555" text-anchor="middle">14</text>
<text x="750.0" y="450.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">16 + 4 + 0 + 4 + 16 = 40, variance = 40/4 = 10</text>
</svg>
