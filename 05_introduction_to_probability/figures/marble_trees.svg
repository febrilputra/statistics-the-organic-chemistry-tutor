<text x="872.0" y="356.2" font-size="13" fill="#222222" text-anchor="start" font-weight="normal">BB  3/7</text>
<text x="250.0" y="425.0" font-size="16" fill="#009E73" text-anchor="middle" font-weight="bold">6/25 + 6/25 = 12/25 = 0.48</text>
<text x="250.0" y="448.0" font-size="13" fill="#555555" text-anchor="middle">Second-draw branches repeat the first-draw ones.</text>
<text x="735.0" y="425.0" font-size="16" fill="#009E73" text-anchor="middle" font-weight="bold">5/21 + 5/21 = 10/21 ≈ 0.476</text>
<text x="735.0" y="448.0" font-size="13" fill="#555555" text-anchor="middle">Second-draw branches use 14 marbles and the updated counts.</text>
