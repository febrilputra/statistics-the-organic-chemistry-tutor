<rect x="830.0" y="269.8" width="30.0" height="28.0" rx="14" stroke="#1F4E79" stroke-width="1.3" fill="#C0392B"/>
<text x="845.0" y="288.8" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">R</text>
<text x="872.0" y="288.8" font-size="13" fill="#009E73" text-anchor="start" font-weight="bold">BR  5/21</text>
<line x1="710.0" y1="317.5" x2="830.0" y2="351.2" stroke="#555555" stroke-width="1.6" fill="none"/>
<text x="765.0" y="349.4" font-size="12.5" fill="#0072B2" text-anchor="end" font-weight="bold">9/14</text>
<rect x="830.0" y="337.2" width="30.0" height="28.0" rx="14" stroke="#1F4E79" stroke-width="1.3" fill="#0072B2"/>
