<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">Bayes' theorem: why a positive test is not a sure diagnosis</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">P(C) = 0.12, P(+ | C) = 0.95, P(+ | no C) = 0.06. Only the positive paths (colored) matter once the test is positive.</text>
<rect x="33.0" y="231.0" width="54.0" height="28.0" rx="14" stroke="#1F4E79" stroke-width="1.3" fill="#ffffff"/>
<text x="60.0" y="250.0" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">start</text>
<line x1="87.0" y1="245.0" x2="185.0" y2="172.5" stroke="#555555" stroke-width="1.6" fill="none"/>
<text x="131.0" y="203.8" font-size="12.5" fill="#0072B2" text-anchor="end" font-weight="bold">0.12</text>
<rect x="185.0" y="158.5" width="30.0" height="28.0" rx="14" stroke="#1F4E79" stroke-width="1.3" fill="#F2F2F2"/>
<text x="200.0" y="177.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">C</text>
<line x1="215.0" y1="172.5" x2="325.0" y2="136.2" stroke="#D55E00" stroke-width="2.8" fill="none"/>
<text x="265.0" y="149.4" font-size="12.5" fill="#0072B2" text-anchor="end" font-weight="bold">0.95</text>
<rect x="325.0" y="122.2" width="30.0" height="28.0" rx="14" stroke="#1F4E79" stroke-width="1.3" fill="#F2F2F2"/>
<text x="340.0" y="141.2" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">+</text>
<text x="367.0" y="141.2" font-size="13" fill="#D55E00" text-anchor="start" font-weight="bold">0.12 × 0.95 = 0.1140</text>
<line x1="215.0" y1="172.5" x2="325.0" y2="208.8" stroke="#555555" stroke-width="1.6" fill="none"/>
<text x="265.0" y="205.6" font-size="12.5" fill="#0072B2" text-anchor="end" font-weight="bold">0.05</text>
<rect x="325.0" y="194.8" width="30.0" height="28.0" rx="14" stroke="#1F4E79" stroke-width="1.3" fill="#F2F2F2"/>
<text x="340.0" y="213.8" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">−</text>
<text x="367.0" y="213.8" font-size="13" fill="#222222" text-anchor="start" font-weight="normal">0.12 × 0.05 = 0.0060</text>
<line x1="87.0" y1="245.0" x2="185.0" y2="317.5" stroke="#555555" stroke-width="1.6" fill="none"/>
<text x="131.0" y="296.2" font-size="12.5" fill="#0072B2" text-anchor="end" font-weight="bold">0.88</text>
<rect x="185.0" y="303.5" width="30.0" height="28.0" rx="14" stroke="#1F4E79" stroke-width="1.3" fill="#F2F2F2"/>
<text x="200.0" y="322.5" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">C'</text>
<line x1="215.0" y1="317.5" x2="325.0" y2="281.2" stroke="#7B4FA0" stroke-width="2.8" fill="none"/>
<text x="265.0" y="294.4" font-size="12.5" fill="#0072B2" text-anchor="end" font-weight="bold">0.06</text>
<rect x="325.0" y="267.2" width="30.0" height="28.0" rx="14" stroke="#1F4E79" stroke-width="1.3" fill="#F2F2F2"/>
<text x="340.0" y="286.2" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">+</text>
<text x="367.0" y="286.2" font-size="13" fill="#7B4FA0" text-anchor="start" font-weight="bold">0.88 × 0.06 = 0.0528</text>
<line x1="215.0" y1="317.5" x2="325.0" y2="353.8" stroke="#555555" stroke-width="1.6" fill="none"/>
<text x="265.0" y="350.6" font-size="12.5" fill="#0072B2" text-anchor="end" font-weight="bold">0.94</text>
<rect x="325.0" y="339.8" width="30.0" height="28.0" rx="14" stroke="#1F4E79" stroke-width="1.3" fill="#F2F2F2"/>
<text x="340.0" y="358.8" font-size="13" fill="#222222" text-anchor="middle" font-weight="bold">−</text>
<text x="367.0" y="358.8" font-size="13" fill="#222222" text-anchor="start" font-weight="normal">0.88 × 0.94 = 0.8272</text>
<text x="60.0" y="435.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold">P(+) = 0.1140 + 0.0528 = 0.1668</text>
<text x="60.0" y="462.0" font-size="15" fill="#D55E00" text-anchor="start" font-weight="bold">P(C | +) = 0.1140 / 0.1668 ≈ 0.683</text>
<text x="580.0" y="108.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold">Imagine 10,000 men</text>
<rect x="580.0" y="120.0" width="43.3" height="36.0" stroke="#ffffff" stroke-width="0.6" fill="#D55E00"/>
<rect x="623.3" y="120.0" width="2.3" height="36.0" stroke="#ffffff" stroke-width="0.6" fill="#F4C9A8"/>
<rect x="625.6" y="120.0" width="20.1" height="36.0" stroke="#ffffff" stroke-width="0.6" fill="#7B4FA0"/>
<rect x="645.7" y="120.0" width="314.3" height="36.0" stroke="#ffffff" stroke-width="0.6" fill="#E4E4E4"/>
<rect x="580.0" y="120.0" width="380.0" height="36.0" stroke="#555555" stroke-width="1.2" fill="none"/>
<rect x="584.0" y="173.0" width="22.0" height="14.0" stroke="#1F4E79" stroke-width="1" fill="#D55E00"/>
<text x="618.0" y="186.0" font-size="13" fill="#222222" text-anchor="start">cancer, positive: 1,140</text>
<rect x="584.0" y="197.0" width="22.0" height="14.0" stroke="#1F4E79" stroke-width="1" fill="#F4C9A8"/>
<text x="618.0" y="210.0" font-size="13" fill="#222222" text-anchor="start">cancer, negative: 60</text>
<rect x="584.0" y="221.0" width="22.0" height="14.0" stroke="#1F4E79" stroke-width="1" fill="#7B4FA0"/>
<text x="618.0" y="234.0" font-size="13" fill="#222222" text-anchor="start">no cancer, positive: 528</text>
<rect x="584.0" y="245.0" width="22.0" height="14.0" stroke="#1F4E79" stroke-width="1" fill="#E4E4E4"/>
<text x="618.0" y="258.0" font-size="13" fill="#222222" text-anchor="start">no cancer, negative: 8,272</text>
<text x="580.0" y="310.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold">Keep only the 1,668 positive tests</text>
<rect x="580.0" y="322.0" width="259.7" height="40.0" stroke="none" fill="#D55E00"/>
<rect x="839.7" y="322.0" width="120.3" height="40.0" stroke="none" fill="#7B4FA0"/>
<text x="709.9" y="347.0" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">1,140 have cancer (68.3%)</text>
<text x="899.9" y="341.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">528 do not</text>
<text x="899.9" y="355.0" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">(31.7%)</text>
<text x="580.0" y="400.0" font-size="15" fill="#D55E00" text-anchor="start" font-weight="bold">P(C | +) = 1,140 / 1,668 ≈ 0.683</text>
<text x="580.0" y="425.0" font-size="13" fill="#555555" text-anchor="start">The disease is rare (12%), so the 6% false positives from</text>
<text x="580.0" y="445.0" font-size="13" fill="#555555" text-anchor="start">the large healthy group make up almost a third of all positives.</text>
</svg>
