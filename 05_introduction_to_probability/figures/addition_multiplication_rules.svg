<text x="145.0" y="245.6" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">0.02</text>
<text x="235.0" y="245.6" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">0.28</text>
<text x="435.0" y="350.6" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">0.28</text>
<text x="345.0" y="245.6" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">0.42</text>
<text x="255.0" y="405.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">and:  P(A and B) = 0.40 × 0.70 = 0.28</text>
<text x="255.0" y="432.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">or:  P(A or B) = 0.30 + 0.70 − 0.28 = 0.72</text>
<text x="747.5" y="103.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">Area diagram (total area = 1)</text>
