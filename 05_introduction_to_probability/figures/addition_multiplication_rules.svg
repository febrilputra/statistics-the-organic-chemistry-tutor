<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">Addition and multiplication rules for Sarah's courses</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">P(A) = 0.30 (algebra), P(B) = 0.70 (biology), P(A | B) = 0.40, so P(A and B) = 0.40 × 0.70 = 0.28.</text>
