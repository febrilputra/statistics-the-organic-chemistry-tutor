<text x="260.0" y="405.0" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">30 / 150 = 0.20</text>
<text x="260.0" y="430.0" font-size="13" fill="#555555" text-anchor="middle">Only the 150 algebra students count; 30 of them take chemistry.</text>
