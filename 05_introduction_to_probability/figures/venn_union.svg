<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">P(A or B) with Venn diagrams</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">S = {1, 2, ..., 9}. Shaded = the union. A = {1, 2, 3, 4}, B = {6, 7, 8}, C = {1, 7, 8, 9}.</text>
<text x="260.0" y="90.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">A and B are mutually exclusive</text>
<rect x="40.0" y="100.0" width="440.0" height="270.0" stroke="#555555" stroke-width="1.5" fill="#ffffff"/>
<text x="50.0" y="122.0" font-size="15" fill="#555555" text-anchor="start" font-weight="bold" font-style="italic">S</text>
<circle cx="160.0" cy="235.0" r="85.0" stroke="none" fill="#F4B183"/>
<circle cx="340.0" cy="235.0" r="85.0" stroke="none" fill="#F4B183"/>
<clipPath id="vclip1"><circle cx="160" cy="235" r="85"/></clipPath>
<circle cx="340.0" cy="235.0" r="85.0" fill="#ffffff" clip-path="url(#vclip1)"/>
<circle cx="160.0" cy="235.0" r="85.0" stroke="#0072B2" stroke-width="2.4" fill="none"/>
<circle cx="340.0" cy="235.0" r="85.0" stroke="#7B4FA0" stroke-width="2.4" fill="none"/>
<text x="160.0" y="141.0" font-size="15" fill="#0072B2" text-anchor="middle" font-weight="bold">A</text>
<text x="340.0" y="141.0" font-size="15" fill="#7B4FA0" text-anchor="middle" font-weight="bold">B</text>
<text x="147.0" y="227.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">1</text>
<text x="173.0" y="227.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">2</text>
<text x="147.0" y="253.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">3</text>
<text x="173.0" y="253.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">4</text>
<text x="455.0" y="128.0" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">5</text>
<text x="455.0" y="153.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">9</text>
<text x="327.0" y="227.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">6</text>
<text x="353.0" y="227.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">7</text>
<text x="340.0" y="253.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">8</text>
<text x="260.0" y="405.0" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">P(A or B) = 4/9 + 3/9 = 7/9</text>
<text x="260.0" y="430.0" font-size="13" fill="#555555" text-anchor="middle">No overlap, so nothing is subtracted.</text>
<text x="740.0" y="90.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">B and C overlap at 7 and 8</text>
<rect x="520.0" y="100.0" width="440.0" height="270.0" stroke="#555555" stroke-width="1.5" fill="#ffffff"/>
<text x="530.0" y="122.0" font-size="15" fill="#555555" text-anchor="start" font-weight="bold" font-style="italic">S</text>
<circle cx="670.0" cy="235.0" r="95.0" stroke="none" fill="#F4B183"/>
<circle cx="800.0" cy="235.0" r="95.0" stroke="none" fill="#F4B183"/>
<clipPath id="vclip2"><circle cx="670" cy="235" r="95"/></clipPath>
<circle cx="800.0" cy="235.0" r="95.0" fill="#E8955A" clip-path="url(#vclip2)"/>
<circle cx="670.0" cy="235.0" r="95.0" stroke="#0072B2" stroke-width="2.4" fill="none"/>
<circle cx="800.0" cy="235.0" r="95.0" stroke="#7B4FA0" stroke-width="2.4" fill="none"/>
<text x="670.0" y="131.0" font-size="15" fill="#0072B2" text-anchor="middle" font-weight="bold">B</text>
<text x="800.0" y="131.0" font-size="15" fill="#7B4FA0" text-anchor="middle" font-weight="bold">C</text>
<text x="640.0" y="240.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">6</text>
<text x="735.0" y="227.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">7</text>
<text x="735.0" y="253.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">8</text>
<text x="905.0" y="325.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">2</text>
<text x="931.0" y="325.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">3</text>
<text x="905.0" y="351.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">4</text>
<text x="931.0" y="351.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">5</text>
<text x="817.0" y="240.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">1</text>
<text x="843.0" y="240.9" font-size="17" fill="#222222" text-anchor="middle" font-weight="bold">9</text>
<text x="740.0" y="405.0" font-size="16" fill="#222222" text-anchor="middle" font-weight="bold">P(B or C) = 3/9 + 4/9 − 2/9 = 5/9</text>
<text x="740.0" y="430.0" font-size="13" fill="#555555" text-anchor="middle">Subtract the overlap {7, 8} once, or it is counted twice.</text>
</svg>
