<text x="450.0" y="300.0" font-size="13" fill="#555555" text-anchor="middle">Quartile deviation = IQR / 2 = 10.5.   Coefficient = (Q3 - Q1)/(Q3 + Q1) = 21/49 = 0.429</text>
