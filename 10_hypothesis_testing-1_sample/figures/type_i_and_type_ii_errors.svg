<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">Type I and Type II errors</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">Left: the four possible outcomes. Right: where α, β and the power come from in a right-tailed test.</text>
<text x="300.0" y="100.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">The truth</text>
<text x="230.0" y="128.0" font-size="13" fill="#555555" text-anchor="middle" font-weight="bold">H0 true</text>
<text x="370.0" y="128.0" font-size="13" fill="#555555" text-anchor="middle" font-weight="bold">H0 false</text>
<text x="105.0" y="185.0" font-size="13" fill="#555555" text-anchor="middle" font-weight="bold"><tspan x="105.0" dy="0.0">Reject</tspan><tspan x="105.0" dy="16.2">H0</tspan></text>
<text x="105.0" y="275.0" font-size="13" fill="#555555" text-anchor="middle" font-weight="bold"><tspan x="105.0" dy="0.0">Fail to</tspan><tspan x="105.0" dy="16.2">reject H0</tspan></text>
<text x="35.0" y="230.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold" transform="rotate(-90 35.0 230.0)">Decision</text>
<rect x="160.0" y="140.0" width="140.0" height="90.0" stroke="#ffffff" stroke-width="3" fill="#F6D5D5"/>
<text x="230.0" y="166.0" font-size="14" fill="#C0392B" text-anchor="middle" font-weight="bold">Type I error</text>
<text x="230.0" y="188.0" font-size="12" fill="#222222" text-anchor="middle">reject a true H0</text>
<text x="230.0" y="210.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">probability α</text>
<rect x="300.0" y="140.0" width="140.0" height="90.0" stroke="#ffffff" stroke-width="3" fill="#D4EFE5"/>
<text x="370.0" y="166.0" font-size="14" fill="#009E73" text-anchor="middle" font-weight="bold">Correct</text>
<text x="370.0" y="188.0" font-size="12" fill="#222222" text-anchor="middle">reject a false H0</text>
<text x="370.0" y="210.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">power = 1 − β</text>
<rect x="160.0" y="230.0" width="140.0" height="90.0" stroke="#ffffff" stroke-width="3" fill="#D4EFE5"/>
<text x="230.0" y="256.0" font-size="14" fill="#009E73" text-anchor="middle" font-weight="bold">Correct</text>
<text x="230.0" y="278.0" font-size="12" fill="#222222" text-anchor="middle">keep a true H0</text>
<text x="230.0" y="300.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">probability 1 − α</text>
<rect x="300.0" y="230.0" width="140.0" height="90.0" stroke="#ffffff" stroke-width="3" fill="#FBE3D2"/>
<text x="370.0" y="256.0" font-size="14" fill="#D55E00" text-anchor="middle" font-weight="bold">Type II error</text>
<text x="370.0" y="278.0" font-size="12" fill="#222222" text-anchor="middle">keep a false H0</text>
<text x="370.0" y="300.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold">probability β</text>
<text x="300.0" y="354.0" font-size="12" fill="#555555" text-anchor="middle">Trial: H0 = "innocent". Convicting an innocent</text>
<text x="300.0" y="372.0" font-size="12" fill="#555555" text-anchor="middle">person is a Type I error.</text>
<text x="725.0" y="108.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="bold">Two possible truths</text>
