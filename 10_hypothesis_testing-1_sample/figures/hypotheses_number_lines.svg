<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="500.0" y="32.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="bold">H0 and Ha split the possible values of the parameter</text>
<text x="500.0" y="54.0" font-size="13" fill="#555555" text-anchor="middle">Blue = values allowed by H0 (it always includes the equality). Orange = values claimed by Ha.</text>
<text x="40.0" y="122.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">1. Calculator mass</text>
<text x="40.0" y="144.0" font-size="13" fill="#555555" text-anchor="start">H0: μ = 450,  Ha: μ ≠ 450</text>
<line x1="380.0" y1="125.0" x2="940.0" y2="125.0" stroke="#D55E00" stroke-width="6" fill="none"/>
<circle cx="660.0" cy="125.0" r="8.0" stroke="none" fill="#0072B2"/>
<text x="384.0" y="115.0" font-size="12" fill="#D55E00" text-anchor="start" font-weight="bold">Ha</text>
<text x="660.0" y="111.0" font-size="12" fill="#0072B2" text-anchor="middle" font-weight="bold">H0 (one value)</text>
<text x="936.0" y="115.0" font-size="12" fill="#D55E00" text-anchor="end" font-weight="bold">Ha</text>
<line x1="380.0" y1="140.0" x2="940.0" y2="140.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="660.0" y1="140.0" x2="660.0" y2="145.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="660.0" y="159.0" font-size="12" fill="#555555" text-anchor="middle">450</text>
<text x="40.0" y="212.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">2. Graduation rate</text>
<text x="40.0" y="234.0" font-size="13" fill="#555555" text-anchor="start">H0: p ≥ 0.80,  Ha: p &lt; 0.80</text>
<line x1="380.0" y1="215.0" x2="660.0" y2="215.0" stroke="#D55E00" stroke-width="6" fill="none"/>
<line x1="660.0" y1="215.0" x2="940.0" y2="215.0" stroke="#0072B2" stroke-width="6" fill="none"/>
<circle cx="660.0" cy="215.0" r="8.0" stroke="none" fill="#0072B2"/>
<text x="800.0" y="203.0" font-size="12" fill="#0072B2" text-anchor="middle" font-weight="bold">H0 (includes 0.8)</text>
<text x="520.0" y="203.0" font-size="12" fill="#D55E00" text-anchor="middle" font-weight="bold">Ha</text>
<line x1="380.0" y1="230.0" x2="940.0" y2="230.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="660.0" y1="230.0" x2="660.0" y2="235.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="660.0" y="249.0" font-size="12" fill="#555555" text-anchor="middle">0.8</text>
<text x="40.0" y="302.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">3. Mean GPA</text>
<text x="40.0" y="324.0" font-size="13" fill="#555555" text-anchor="start">H0: μ = 2.7,  Ha: μ ≠ 2.7</text>
<line x1="380.0" y1="305.0" x2="940.0" y2="305.0" stroke="#D55E00" stroke-width="6" fill="none"/>
<circle cx="660.0" cy="305.0" r="8.0" stroke="none" fill="#0072B2"/>
<text x="384.0" y="295.0" font-size="12" fill="#D55E00" text-anchor="start" font-weight="bold">Ha</text>
<text x="660.0" y="291.0" font-size="12" fill="#0072B2" text-anchor="middle" font-weight="bold">H0 (one value)</text>
<text x="936.0" y="295.0" font-size="12" fill="#D55E00" text-anchor="end" font-weight="bold">Ha</text>
<line x1="380.0" y1="320.0" x2="940.0" y2="320.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="660.0" y1="320.0" x2="660.0" y2="325.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="660.0" y="339.0" font-size="12" fill="#555555" text-anchor="middle">2.7</text>
<text x="40.0" y="392.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold">4. Vehicle ownership</text>
<text x="40.0" y="414.0" font-size="13" fill="#555555" text-anchor="start">H0: p ≤ 0.75,  Ha: p &gt; 0.75</text>
<line x1="660.0" y1="395.0" x2="940.0" y2="395.0" stroke="#D55E00" stroke-width="6" fill="none"/>
<line x1="380.0" y1="395.0" x2="660.0" y2="395.0" stroke="#0072B2" stroke-width="6" fill="none"/>
<circle cx="660.0" cy="395.0" r="8.0" stroke="none" fill="#0072B2"/>
<text x="520.0" y="383.0" font-size="12" fill="#0072B2" text-anchor="middle" font-weight="bold">H0 (includes 0.75)</text>
<text x="800.0" y="383.0" font-size="12" fill="#D55E00" text-anchor="middle" font-weight="bold">Ha</text>
<line x1="380.0" y1="410.0" x2="940.0" y2="410.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="660.0" y1="410.0" x2="660.0" y2="415.0" stroke="#555555" stroke-width="1" fill="none"/>
<text x="660.0" y="429.0" font-size="12" fill="#555555" text-anchor="middle">0.75</text>
</svg>
