<text x="500.0" y="342.0" font-size="13" fill="#555555" text-anchor="middle">population proportion p  (fraction of Texans who own a house)</text>
<text x="340.0" y="380.0" font-size="14" fill="#D55E00" text-anchor="middle" font-weight="bold">p̂ = (0.62383 + 0.67217) / 2 = 0.648</text>
<text x="700.0" y="380.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="bold">E = 0.04834 / 2 = 0.02417</text>
