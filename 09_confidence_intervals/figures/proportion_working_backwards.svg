<line x1="796.0" y1="167.0" x2="796.0" y2="193.0" stroke="#009E73" stroke-width="3" fill="none"/>
<circle cx="506.0" cy="180.0" r="8" stroke="none" fill="#D55E00"/>
<text x="216.0" y="216.0" font-size="13.5" fill="#009E73" text-anchor="middle" font-weight="bold">lower = 0.62383</text>
<text x="796.0" y="216.0" font-size="13.5" fill="#009E73" text-anchor="middle" font-weight="bold">upper = 0.67217</text>
<text x="506.0" y="216.0" font-size="13.5" fill="#D55E00" text-anchor="middle" font-weight="bold">p̂ = midpoint</text>
<line x1="216.0" y1="236.0" x2="216.0" y2="242.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="796.0" y1="236.0" x2="796.0" y2="242.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<line x1="216.0" y1="242.0" x2="796.0" y2="242.0" stroke="#555555" stroke-width="1.3" fill="none"/>
<text x="506.0" y="261.0" font-size="12.5" fill="#555555" text-anchor="middle">full width = 0.67217 − 0.62383 = 0.04834 = 2E</text>
