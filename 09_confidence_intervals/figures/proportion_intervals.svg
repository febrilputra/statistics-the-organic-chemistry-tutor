<text x="500.0" y="385.0" font-size="13" fill="#555555" text-anchor="middle">Texas: p̂ = (0.62383 + 0.67217)/2 = 0.648 and E = (0.67217 − 0.62383)/2 = 0.02417, then n = z²p̂q̂/E² ≈ 1,500.</text>
